            <div class="nav-right" style="display: flex; align-items: center; gap: 10px; margin-left: auto;">

    <div class="page-container">
        <div class="video-main">
            <div class="video-header" style="margin-bottom:8px;">
                <h1 style="font-size:20px;" id="currentVideoTitle">选择下方课时开始观看</h1>
            </div>

            <!-- 播放器区域：仅保留bilibili嵌入 -->
            <div class="video-player-wrapper" id="playerWrapper">
                <div class="container show-controls" id="videoContainer" style="display: none;">
                    <video id="mainVideo" src="" preload="auto" playsinline></video>
                </div>
                <div class="bilibili-embed" id="bilibiliContainer" style="display: block;">
                    <iframe id="bilibiliIframe" src="" allowfullscreen="true" scrolling="no" frameborder="0"
                        sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
                </div>
            </div>

            <div class="status-bar">
                <span><i class="bx bx-play-circle"></i> 点击课时直接播放对应分P</span>
                <span id="mirrorStatus" style="display:none;"></span>
                <span id="loopStatus" style="display:none;"></span>
                <span style="background:#ffeef2; padding:0 8px; border-radius:20px; color:#FB7299;"
                    id="totalChapterHint">总课时 92</span>
            </div>
        </div>

        <!-- 侧边栏 -->
        <div class="video-sidebar">
            <div class="sidebar-header">

            </div>
            <div class="chapter-list-container">
                <ul class="chapter-list" id="chapterList">
                    <li class="empty-message">⏳ 加载分页数据...</li>
                </ul>
                <div class="pagination-bar">
                    <button class="page-btn" id="prevPageBtn" disabled>
                        <i class="bx bx-chevron-left"></i> 上一章
                    </button>
                    <div class="page-input-container">
                        <i class="bx bx-book"></i>
                        <input type="number" id="pageInput" class="page-input" min="1" max="11" value="1" step="1">
                        <span class="page-total">/ 11章</span>
                    </div>
                    <button class="page-btn" id="nextPageBtn">
                        下一章 <i class="bx bx-chevron-right"></i>
                    </button>
                </div>
            </div>
            <div class="sidebar-footer-note">
                <i class="bx bx-bulb"></i> 内嵌92条课时数据，点击即播对应B站分P。
            </div>
